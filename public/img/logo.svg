<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#8839ef"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(66, 133, 244, 0.28)" stroke-width="8"/>
  <g id="icon" filter="url(#glow)">
    <!-- Base do capelo -->
    <path d="M150 262 V332 C150 385 362 385 362 332 V262 L256 306 Z" fill="#e3e3e3"/>
    <!-- Topo do capelo com gradiente Astra -->
    <path d="M256 130 L444 210 L256 290 L68 210 Z" fill="url(#capGrad)"/>
    <!-- Cordão e borla -->
    <path d="M426 218 V338" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="426" cy="352" r="20" fill="#a855f7"/>
  </g>
</svg>
