<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17130f" />
    <title>GStudy · Sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #17130f;
        color: #f0e7da;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(420px, 100%);
        text-align: center;
      }
      img {
        width: 88px;
        height: 88px;
        border-radius: 20px;
      }
      h1 {
        margin: 24px 0 10px;
        font-family: Georgia, serif;
        font-size: 32px;
      }
      p {
        color: #bdb0a1;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        margin-top: 16px;
        padding: 0 22px;
        border: 1px solid #c4a484;
        border-radius: 12px;
        background: #c4a484;
        color: #17130f;
        font:
          600 14px Inter,
          system-ui,
          sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/gstudy-192.png" alt="" />
      <h1>Você está sem conexão.</h1>
      <p>
        Reconecte-se para sincronizar seus estudos. O que já foi salvo neste aparelho continua
        seguro.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
